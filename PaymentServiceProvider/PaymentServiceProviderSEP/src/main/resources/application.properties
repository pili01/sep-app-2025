spring.application.name=PaymentServiceProviderSEP

spring.datasource.url=jdbc:postgresql://localhost:5432/paymentServiceProvider_app
spring.datasource.username=postgres
spring.datasource.password=super
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql = true

#formatira ispis SQL upita koje Hibernate pravi ka bazi na IDE konzoli
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
#Hibernate optimizacija SQL upita za Postgres bazu
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
#https://vladmihalcea.com/the-open-session-in-view-anti-pattern/
spring.jpa.open-in-view=false

#Za puling prema bazi
#minimum number of idle connections maintained by HikariCP in a connection pool
spring.datasource.hikari.minimumIdle=5
#maximum pool size
spring.datasource.hikari.maximumPoolSize=20
#maximum idle time for connection
spring.datasource.hikari.idleTimeout=30000
spring.datasource.hikari.poolName=SpringBootJPAHikariCP
# maximum lifetime in milliseconds of a connection in the pool after it is closed.
spring.datasource.hikari.maxLifetime=2000000
#maximum number of milliseconds that a client will wait for a connection
spring.datasource.hikari.connectionTimeout=30000
# Enable logging to verify that HikariCP is used, the second entry is specific to HikariCP
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.zaxxer.hikari.HikariConfig=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port = 8442

server.ssl.enabled=true
server.ssl.key-store=classpath:keystore/paymentServiceProviderBe.p12
server.ssl.key-store-password=SertifikatZaSEP2025!
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=paymentServiceProvider-cert
server.ssl.client-auth=none
server.ssl.enabled-protocols=TLSv1.3
