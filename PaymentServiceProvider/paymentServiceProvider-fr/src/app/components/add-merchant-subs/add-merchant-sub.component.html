<div class="add-sub-container">
  @if (isLoading()) {
    <div class="loading-spinner">Checking available methods...</div>
  } @else {
    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Select Payment Method</label>
        @if (availableCodes().length > 0) {
          <select [(ngModel)]="newSub.paymentMethodCode" name="code" class="psp-input">
            @for (code of availableCodes(); track code) {
              <option [value]="code">{{ code }}</option>
            }
          </select>
        } @else {
          <div class="info-box">
            This merchant already has all available payment methods enabled.
          </div>
        }
      </div>

      <div class="form-group">
        <label>Initial Configuration (JSON)</label>
        <textarea [(ngModel)]="newSub.configJson" name="config" rows="5" 
                  class="psp-input" placeholder='{"key": "value"}'></textarea>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-back" (click)="onCancel.emit()">Back</button>
        <button type="submit" class="btn-save" [disabled]="availableCodes().length === 0">
          Create Subscription
        </button>
      </div>
    </form>
  }
</div>
