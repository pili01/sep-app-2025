<div class="failed-container">
  <div class="failed-card">

    <div class="sad-face">
      <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3">
        <circle cx="50" cy="50" r="40"/>
        <circle cx="35" cy="40" r="3" fill="currentColor"/>
        <circle cx="65" cy="40" r="3" fill="currentColor"/>
        <path d="M 35 65 Q 50 55 65 65" stroke-linecap="round"/>
      </svg>
    </div>

    <h1 class="failed-title">Greška pri plaćanju</h1>
    <p class="failed-message">Nažalost, vaša transakcija nije bila uspješna</p>

    <div class="error-details">
      <div class="error-reason">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span>Molimo pokušajte ponovo</span>
      </div>
    </div>

    <div class="suggestions">
      <h3>Mogući razlozi:</h3>
      <ul>
        <li>Nedovoljna sredstva na računu</li>
        <li>Pogrešni podaci kartice</li>
        <li>Transakcija odbijena od strane banke</li>
        <li>Problem sa mrežom</li>
      </ul>
    </div>

    <div class="countdown-wrapper">
      <p class="countdown-text">Preusmjeravanje za <span class="countdown-number">{{ countdown() }}</span> sekundi...</p>
    </div>

    <button class="failed-button" (click)="navigateToRentals()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Nazad na iznajmljivanja
    </button>
  </div>
</div>
