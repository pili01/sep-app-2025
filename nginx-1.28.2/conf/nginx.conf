events {
    worker_connections 1024;
}

http {
    # 1. Define a "detailed" format that includes the upstream address (the backend port)
    log_format detailed '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status '
                        'to: $upstream_addr';
    upstream spring_backend {
        least_conn;
        server 127.0.0.1:8440 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:8439 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 8442 ssl;
        server_name localhost;
        access_log logs/access.detailed.log detailed;

        # Putanje do sertifikata
        ssl_certificate     certs/bankFr.crt;
        ssl_certificate_key certs/bankFr.key;

        # SSL optimizacija
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            # --- 1. CORS Preflight (OPTIONS) ---
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' 'https://localhost:4202' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            # --- 2. Upstream SSL (Komunikacija sa Spring-om) ---
            proxy_ssl_verify off;            # Ignoriši self-signed sertifikat od Spring-a
            proxy_ssl_server_name on;        # REŠAVA "Illegal Parameter" Alert 47
            proxy_ssl_name $host;            # Šalje "localhost" backendu tokom SSL rukovanja
            proxy_ssl_protocols TLSv1.2 TLSv1.3;

            proxy_http_version 1.1;
            
            # --- 3. Headeri za Backend ---
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Internal-Gateway "H6pZk8Zx5zR3y2PqN0mX9YwKc7VJmT4FQdA1B8eS2uM=";

            # --- 4. CORS za stvarne zahtjeve ---
            # add_header 'Access-Control-Allow-Origin' 'https://localhost:4202' always;
            # add_header 'Access-Control-Allow-Credentials' 'true' always;

            proxy_pass https://spring_backend;
        }
    }
}